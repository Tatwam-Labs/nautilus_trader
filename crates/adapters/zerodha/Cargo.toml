[package]
name = "nautilus-zerodha"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Zerodha Kite Connect integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_zerodha"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["nautilus-model/high-precision"]

[package.metadata.cargo-machete]
ignored = [
  "nautilus-system",
] # Optional dep activated only via the python feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }
nautilus-system = { workspace = true, optional = true }
# `nautilus-network` returns with the WebSocket transport commit -- it is not carried in the
# meantime, because an unused dependency that is "for later" is indistinguishable from one that is
# simply wrong.

anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
# Returned to [dependencies] with the subscription layer, which serialises outbound control
# messages. B3 was correct when it moved this out -- nothing in the shipped crate used it then.
# Every sibling adapter carries it here for the same reason.
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true }

# Declared so the python-registration test only builds when the feature is on, matching the 17 of
# 19 in-tree adapters that do the same.
[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
