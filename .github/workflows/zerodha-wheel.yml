name: zerodha-wheel

# Build a cp314 / manylinux / x86_64 wheel from the zerodha-adapter fork and
# PROVE THE ZERODHA SYMBOLS IMPORT. A wheel that installs is not the
# deliverable; eleven of thirteen PyO3 registration surfaces fail silently, so
# "it built" and "it exports" are different claims and only the second counts.
#
# Deliberately self-contained rather than reusing build.yml: that workflow is
# wired to release planning and publication, and this needs neither.
#
# TARGET: cp314, NOT cp312. The interpreter is COUPLED TO THE NAUTILUS MAJOR —
# prod runs the older interpreter because it still runs nautilus v1, and this
# adapter is a v2 artefact that cannot load into a v1 runtime at all. The
# correct question is the interpreter of the ARTEFACT'S deployment target
# (at-base:2.0.0rc3 -> python 3.14.7, abi cpython-314-x86_64-linux-gnu), not of
# the currently deployed app. main already builds 3.14 (Dockerfile:84 FROM
# at-base:2.0.0rc3, :141 python:3.14-slim); the deployed image predates that
# switch, so the running artefact and the build recipe had already diverged.
#
# HOST: every target builds on a NATIVE runner. No QEMU anywhere — this
# workspace has a recorded history of QEMU cross-builds running out of memory
# on fat LTO, and a release build is exactly where that bites.
#
# THREE TARGETS, because three different machines run this artefact:
#   linux/x86_64  — prod (13.202.251.163, uname -m = x86_64)
#   linux/aarch64 — LOCAL DOCKER on Apple Silicon. Docker on a Mac runs LINUX
#                   containers, so this is linux/arm64 and NOT the macOS wheel;
#                   they are different artefacts and neither substitutes.
#   macos/arm64   — running directly on the Mac mini, outside Docker, which is
#                   how the adapter is exercised against a live venue.

on:
  # Push trigger as well as dispatch: a workflow_dispatch-only file on a
  # NON-DEFAULT branch is not reliably addressable by the API, and this file
  # deliberately does not go near the default branch.
  push:
    branches: [ci/zerodha-wheel]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build
        required: false
        default: feat/zerodha-adapter

env:
  PACKAGE_DIR: python
  # Fat LTO OOMs on these runners. Thin is not a preference, it is the only
  # setting that completes.
  CARGO_PROFILE_RELEASE_LTO: thin
  # Matches upstream build.yml's limit for GitHub-hosted runners.
  CARGO_BUILD_JOBS: "2"

jobs:
  wheel:
    runs-on: ${{ matrix.runner }}
    strategy:
      # fail-fast OFF: one target failing must not hide whether the other two
      # are healthy. A partial result is still information; a cancelled one is not.
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            docker_platform: linux/amd64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
          - target: macos-arm64
            runner: macos-14
            docker_platform: ""   # no container acceptance on macOS; see the step
    # A git-ref pin forces a SOURCE build of nautilus — prebuilt wheels do not
    # apply here — so this is long by nature, not by accident.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      # ⚠️ `.cargo/config.toml:16` sets `link-arg=-fuse-ld=lld`, so EVERY target needs lld
      # present or the build dies with `collect2: fatal error: cannot find 'ld'` — a message that
      # names the WRONG tool and sends you looking at the linker rather than at a missing package.
      # ubuntu-latest ships lld; ubuntu-24.04-arm does NOT, which is why aarch64 failed and x86_64
      # did not. macOS uses its own linker and needs nothing.
      - name: Install lld (Linux only — the cargo config demands it)
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld
          ld.lld --version

      - name: Record exactly what is being built
        run: |
          echo "ref_input=${{ inputs.ref }}"
          echo "sha=$(git rev-parse HEAD)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"
          echo "runner_arch=$(uname -m)"
          echo "target=${{ matrix.target }}"
          echo "runner=${{ matrix.runner }}"

      # A nautilus source build fills the default runner disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show the interpreter (ASK IT, do not read a Dockerfile)
        run: |
          python -c "import sys, sysconfig; print('python', sys.version.split()[0]); print('tag', sysconfig.get_config_var('SOABI'))"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin at the pinned version
        run: |
          MATURIN_VERSION="$(bash scripts/maturin-version.bash 2>/dev/null || echo 1.14.1)"
          echo "maturin==${MATURIN_VERSION}"
          python -m pip install --upgrade pip
          python -m pip install "maturin==${MATURIN_VERSION}" patchelf

      # The zerodha crate gates PyO3 behind a separate `python` feature
      # (default = ["high-precision"]). Two routes already enable it on this
      # branch — crates/pyo3/Cargo.toml declares
      # `nautilus-zerodha = { features = ["python"] }`, and maturin's
      # `extension-module` pulls `nautilus-zerodha/extension-module` which
      # includes `python`. Asserted here so a config change that removes both
      # fails LOUDLY rather than producing a wheel that exports nothing.
      - name: Assert the zerodha python feature is actually wired
        run: |
          set -euo pipefail
          grep -q 'nautilus-zerodha.*features.*python' crates/pyo3/Cargo.toml \
            || { echo "FAIL: crates/pyo3 no longer enables nautilus-zerodha/python"; exit 1; }
          grep -q 'nautilus-zerodha/extension-module' crates/pyo3/Cargo.toml \
            || echo "NOTE: extension-module route absent; relying on the direct dependency feature"
          echo "zerodha python feature: WIRED"

      # ⚠️ WHY: our wheel self-reports the bare upstream version `2.0.0rc3`, and PyPI ALREADY
      # carries 2.0.0rc1 and 2.0.0rc2 — so upstream's own 2.0.0rc3 is next in that sequence.
      # Once it lands, that string names TWO different binaries: theirs (no Zerodha adapter)
      # and ours (with it). Nothing in the version tells them apart.
      #
      # A PEP 440 LOCAL VERSION IDENTIFIER fixes this and is exactly what they exist for.
      # Precedent: torch ships `torch-2.1.0+cu118-...whl`.
      #   * a local version CANNOT be uploaded to PyPI, so ours can never be shadowed there
      #   * `==2.0.0rc3` still matches it (PEP 440 ignores local labels unless the specifier
      #     names one), so AT's pin keeps working unchanged
      #   * `==2.0.0rc3+tatwam.zerodha.<sha>` pins OUR exact build when that is wanted
      #   * `pip freeze` in a container now names the source commit
      - name: Stamp a PEP 440 local version identifier
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -eux
          # ⛔ HEAD, not the github.sha env var. On a workflow_dispatch that variable is the
          # tip of the branch the WORKFLOW FILE came from, so the stamp would name a commit
          # the wheel was NOT built from — defeating the whole point of the stamp.
          SHORT=$(git rev-parse --short=7 HEAD)
          python3 - "$SHORT" <<'STAMP'
          import re, sys
          short = sys.argv[1]
          p = "pyproject.toml"
          s = open(p).read()
          m = re.search(r'^version = "([^"]+)"$', s, re.M)
          assert m, "version line not found in pyproject.toml — layout changed, FIX THIS"
          base = m.group(1).split("+")[0]
          new = f"{base}+tatwam.zerodha.{short}"
          s2 = s.replace(m.group(0), f'version = "{new}"', 1)
          assert s2 != s, "replacement was a no-op"
          open(p, "w").write(s2)
          print(f"stamped: {m.group(1)} -> {new}")
          STAMP
          grep -n '^version = ' pyproject.toml

      - name: Build the wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: maturin build --release --out ../dist

      - name: Report what was actually produced
        run: |
          ls -la dist/
          echo "--- wheel tags ---"
          for w in dist/*.whl; do echo "$w"; done

      # ── ACCEPTANCE ──────────────────────────────────────────────────────
      # Run INSIDE a clean linux/amd64 python:3.14 container, not on the bare
      # runner: that also proves the manylinux tag is satisfiable somewhere
      # other than the machine that built it.
      - name: ACCEPTANCE — the zerodha symbols must IMPORT
        run: |
          set -euo pipefail
          cat > /tmp/accept.py <<'PY'
          import platform, sys
          print("arch:", platform.machine())
          print("python:", sys.version.split()[0])
          import nautilus_trader
          print("nautilus_trader:", getattr(nautilus_trader, "__version__", "?"))
          import nautilus_trader.adapters.zerodha as z
          names = [n for n in dir(z) if not n.startswith("_")]
          print("zerodha symbols:", len(names))
          print("sample:", sorted(names)[:15])
          assert names, "zerodha package imported but exports NOTHING"
          print("ACCEPTANCE: OK")
          PY
          if [ -n "${{ matrix.docker_platform }}" ]; then
            # Linux targets: run in a CLEAN container, which also proves the
            # manylinux tag is satisfiable somewhere other than the builder.
            docker run --rm --platform ${{ matrix.docker_platform }} \
              -v "$PWD/dist":/dist:ro -v /tmp/accept.py:/accept.py:ro \
              python:3.14-slim bash -lc \
                "pip install --quiet /dist/*.whl && python /accept.py"
          else
            # macOS: no container. A throwaway venv is the closest equivalent —
            # it still proves the wheel INSTALLS and EXPORTS, which is the claim.
            python -m venv /tmp/accept-venv
            /tmp/accept-venv/bin/pip install --quiet dist/*.whl
            /tmp/accept-venv/bin/python /tmp/accept.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zerodha-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ── PUBLISH ────────────────────────────────────────────────────────────────
  # Runs only if ALL THREE targets pass. A partial publish is worse than none:
  # it produces a release where one architecture is silently missing, and the
  # machine that needs the missing one fails at install time rather than here.
  publish:
    needs: wheel
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and prove all three arrived
        run: |
          set -euo pipefail
          mkdir -p dist && find artifacts -name '*.whl' -exec mv {} dist/ \;
          ls -la dist/
          # ⚠️ ASSERT, do not assume. `needs: wheel` succeeding means the JOBS
          # passed; it does not prove three FILES landed here. Those are
          # different claims and the second is the one that matters.
          n=$(ls dist/*.whl | wc -l | tr -d ' ')
          [ "$n" -eq 3 ] || { echo "expected 3 wheels, found $n"; exit 1; }

      - name: Publish the per-SHA release (the one to PIN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          # NOTE: deliberately NOT the github.sha env var — on a workflow_dispatch
          # that is the tip of the branch the WORKFLOW FILE came from
          # (ci/zerodha-wheel), not the ref being built.
          FULL_SHA=$(git rev-parse HEAD)
          gh release create "wheel-${SHA}" dist/*.whl \
            --target "${FULL_SHA}" \
            --title "Zerodha adapter wheels (${SHA})" \
            --notes "Built from \`$(git rev-parse --abbrev-ref HEAD)\` at \`${SHA}\` with \`maturin build --release\`.

          cp314. Three targets: linux x86_64, linux aarch64, macOS arm64.

          **PIN THIS URL, not \`wheel-latest\`.** A stable URL plus Docker layer caching means a
          rebuilt image silently reuses the cached download and keeps running the old wheel. A
          SHA in the URL changes when the wheel changes, so the cache invalidates *because*
          something changed — which is the behaviour you want.

          Verify what you are actually running: the node startup banner prints \`git_commit\`." \
            --prerelease

      - name: Move the `wheel-latest` pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          # NOTE: deliberately NOT the github.sha env var — on a workflow_dispatch
          # that is the tip of the branch the WORKFLOW FILE came from
          # (ci/zerodha-wheel), not the ref being built.
          FULL_SHA=$(git rev-parse HEAD)
          # Deleted and recreated rather than edited: `gh release upload --clobber`
          # leaves assets from a PREVIOUS run in place if this run produced fewer,
          # so `latest` could end up a mix of two builds. Recreating cannot.
          gh release delete wheel-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create wheel-latest dist/*.whl \
            --target "${FULL_SHA}" \
            --title "Zerodha adapter wheels — LATEST (${SHA})" \
            --notes "⚠️ **A MOVING POINTER. Currently \`${SHA}\`.**

          For convenience — a \`curl\` that always fetches the newest build.

          **Do NOT pin this in a Dockerfile.** The URL never changes, so Docker reuses its cached
          layer and you keep the old wheel with nothing to tell you. Pin \`wheel-<sha>\` instead." \
            --prerelease
